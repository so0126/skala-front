<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나의 소개</title>
</head>

<body>

  <header>
    <!-- h1: 이 페이지의 주제를 나타내는 가장 큰 제목입니다. -->
    <h1>안녕하시와요? 박소영입니다.</h1>
    <p>저를 한번 소개해보겠나이다! ! !</p>
  </header>

  <hr />

  <main>

    <!-- section: "좋아하는 음식"이라는 하나의 주제 덩어리입니다. -->
    <section>
      <h2>내가 좋아하는 음식</h2>

      <!-- ul: 순서가 중요하지 않은 목록입니다. 음식은 순위가 아니므로 ul을 씁니다. (과제 2 요구사항) -->
      <ul>
        <!-- li: 목록의 항목 하나입니다. ul/ol 안에서만 사용합니다. -->
        <li>봄에는 도다리회</li>
        <li>여름이니까 복숭아</li>
        <li>가을이라면 무화과</li>
        <li>겨울하면 추어탕</li>
      </ul>
    </section>

    <section>
      <h2>올해 할 일</h2>

      <!-- ol: 순서가 중요한 목록입니다. 번호가 자동으로 붙습니다. (과제 3 요구사항) -->
      <ol>
        <li>취업하기</li>
        <li>정보처리기사 취득</li>
        <li>CS 지식 쌓기</li>
      </ol>
    </section>

    <section>
      <h2>나를 설명하는 단어들</h2>

      <!-- dl: 용어와 설명을 짝지어 보여주는 목록입니다. (Description List) (과제 2 요구사항) -->
      <dl>
        <!-- dt: 설명할 용어(제목)입니다. -->
        <dt>큐티</dt>
        <!-- dd: 바로 위 dt에 대한 설명입니다. -->
        <dd>나름 귀엽습니다.</dd>

        <dt>리락쿠마</dt>
        <dd>리락쿠마라는 산엑스 캐릭터를 좋아합니다.</dd>

        <dt>사진</dt>
        <dd>풍경 사진 찍는걸 좋아합니다.</dd>

      </dl>
    </section>

  </main>

  <hr />

  <footer>
    <!-- a: 메인 페이지로 돌아가는 링크입니다. 같은 폴더 안이라 파일 이름만 적으면 됩니다. -->
    <p><a href="index.html">메인으로 돌아가기</a></p>
  </footer>

</body>
</html>
