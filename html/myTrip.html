<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나의 여행지</title>
</head>

<body>

  <header>
    <h1>나의 여행지</h1>
    <p>사진, 소리, 영상으로 기억에 남는 여행지를 소개합니다.</p>
  </header>

  <hr />

  <main>

    <!-- section: 여행지 한 곳에 대한 내용 덩어리입니다. -->
    <!-- class="trip-card": 지금은 아무 효과가 없습니다. 나중에 CSS 과제에서 -->
    <!-- 이 이름을 골라 카드 모양으로 꾸미기 위해 미리 붙여둔 이름표입니다. -->
    <section class="trip-card">
      <h2>삿포로 비에이투어 - 크리스마스 트리 보러 가는 길</h2>

      <!-- figure: 사진과 그 사진의 설명을 하나로 묶는 태그입니다. -->
      <figure>
        <!-- img: 이미지를 화면에 표시합니다. (과제 7 요구사항) -->
        <!-- src: 이미지 파일 경로. ../는 "한 폴더 위로 나간다"는 뜻이라 html 폴더에서 나와 media 폴더로 들어갑니다. -->
        <!-- alt: 이미지가 안 보일 때 대신 나오는 글. 화면 낭독기도 이 글을 읽어줍니다. 필수로 적는 습관을 들이세요. -->
        <!-- width: 이미지 가로 크기(px). CSS 없이 크기를 정할 때 쓰는 HTML 속성입니다. -->
        <img src="../media/KakaoTalk_20260717_093824488_01.jpg" alt="삿포로의 눈내린 자연" width="480" />

        <!-- figcaption: figure 안의 사진 설명(캡션)입니다. -->
        <figcaption>삿포로 비에이투어에서 크리스마스 트리보러가다가 찍었습니다.</figcaption>
      </figure>

      <p>
        우박이 오고 정말 난리만리였지만 크리스마스 트리는 정말 멀리 있고 조그맣게 보였어요.
      </p>
    </section>

    <hr />

    <section class="trip-card">
      <h2>도토리가 어쨌다고? 굴러간다고~</h2>

      <p>일본 여행 쇼츠만 틀었다하면 나오는 그 ! 노 ! 래 ! 맞습니다.</p>

      <!-- audio: 소리 파일을 재생합니다. (과제 7 요구사항) -->
      <!-- controls: 재생/정지 버튼을 화면에 보여줍니다. 이게 없으면 아무것도 안 보입니다. -->
      <audio controls>
        <!-- source: 재생할 파일 후보입니다. 브라우저가 위에서부터 읽어보고 -->
        <!-- 자기가 재생할 수 있는 첫 번째 파일을 고릅니다. (과제 7 요구사항) -->
        <!-- type: 파일 형식을 미리 알려줘서 브라우저가 빠르게 판단하게 돕습니다. -->
        <source src="../media/1280. 데굴데굴 토리.mp3" type="audio/mpeg" />

        <!-- source를 하나도 재생할 수 없는 오래된 브라우저에만 이 글이 보입니다. -->
        이 브라우저는 오디오 재생을 지원하지 않습니다.
      </audio>
    </section>

    <hr />

    <section class="trip-card">
      <h2>삿포로 오타루 운하 오르골 가게</h2>

      <p>오르골 가게에 있던 펭귄 인형~~~ 짱 커요.</p>

      <!-- video: 영상을 재생합니다. (과제 7 요구사항) -->
      <!-- controls: 재생 버튼 표시 / width: 영상 가로 크기 -->
      <!-- poster: 재생 전에 미리 보여줄 대표 이미지입니다. -->
      <video controls width="480" poster="../media/busan-poster.jpg">
        <!-- source: audio와 똑같은 원리입니다. mp4를 먼저 시도하고 안 되면 webm을 씁니다. (과제 7 요구사항) -->
        <source src="../media/KakaoTalk_20260717_093828377.mp4" type="video/mp4" />
        이 브라우저는 비디오 재생을 지원하지 않습니다.
      </video>
    </section>

  </main>

  <hr />

  <footer>
    <p><a href="index.html">메인으로 돌아가기</a></p>
  </footer>

</body>
</html>
