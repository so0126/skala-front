<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나의 여행지</title>

  <!-- link: 외부 CSS 파일을 이 문서에 연결합니다. (과제 9 요구사항) -->
  <link rel="stylesheet" href="../css/style.css" />
</head>

<body>
  <!-- div class="container": 모든 콘텐츠를 감싸는 상자입니다. (과제 10 요구사항) -->
  <!-- CSS에서 max-width와 margin: 0 auto로 화면 가운데에 오도록 했습니다. -->
  <div class="container">

    <header>
      <h1>나의 여행지</h1>
      <p>사진, 소리, 영상으로 기억에 남는 여행지를 소개합니다.</p>
    </header>

    <hr />

    <div id="site-nav"></div>

    <hr />

    <main class="trip-grid">

      <section class="trip-card">
        <h2>삿포로 비에이투어 - 크리스마스 트리 보러 가는 길</h2>

        <figure>
          <img src="../media/KakaoTalk_20260717_093824488_01.jpg" alt="삿포로의 눈내린 자연" width="480" />

          <figcaption>삿포로 비에이투어에서 크리스마스 트리보러가다가 찍었습니다.</figcaption>
        </figure>

        <p>
          우박이 오고 정말 난리만리였지만 크리스마스 트리는 정말 멀리 있고 조그맣게 보였어요.
        </p>
      </section>

      <hr />

      <section class="trip-card">
        <h2>도토리가 어쨌다고? 굴러간다고~</h2>

        <p>일본 여행 쇼츠만 틀었다하면 나오는 그 ! 노 ! 래 ! 맞습니다.</p>

        <audio controls>
          <source src="../media/1280. 데굴데굴 토리.mp3" type="audio/mpeg" />

          이 브라우저는 오디오 재생을 지원하지 않습니다.
        </audio>
      </section>

      <hr />

      <section class="trip-card">
        <h2>삿포로 오타루 운하 오르골 가게</h2>

        <p>오르골 가게에 있던 펭귄 인형~~~ 짱 커요.</p>

        <video controls width="480">
          <source src="../media/KakaoTalk_20260717_093828377.mp4" type="video/mp4" />
          이 브라우저는 비디오 재생을 지원하지 않습니다.
        </video>
      </section>

    </main>

    <hr />

    <footer>
      <p>SKALA Front-End 실습 과제</p>
    </footer>

  </div>

  <script src="../script/nav.js"></script>

</body>
</html>
